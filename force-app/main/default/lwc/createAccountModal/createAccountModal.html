<template>
  <lightning-modal-header title="New Account"></lightning-modal-header>
  <lightning-modal-body>
    {content}
    <br />
    <lightning-layout multiple-rows>
      <lightning-layout-item
        size="12"
        padding="around-small"
        small-device-size="12"
        medium-device-size="6"
        large-device-size="6"
      >
        <lightning-input
          type="text"
          variant="standard"
          name="Name"
          label="Name"
        ></lightning-input>
      </lightning-layout-item>
      <lightning-layout-item
        size="12"
        padding="around-small"
        small-device-size="12"
        medium-device-size="6"
        large-device-size="6"
      >
        <lightning-input
          type="text"
          variant="standard"
          name="Phone"
          label="Phone"
        ></lightning-input>
      </lightning-layout-item>
      <lightning-layout-item
        size="12"
        padding="around-small"
        small-device-size="12"
        medium-device-size="6"
        large-device-size="6"
      >
        <lightning-textarea
          name="Description"
          label="Description"
          placeholder="type here..."
          value=""
        ></lightning-textarea>
      </lightning-layout-item>
      <lightning-layout-item
        size="12"
        padding="around-small"
        small-device-size="12"
        medium-device-size="6"
        large-device-size="6"
      >
        <lightning-input-address
          address-label="Address"
          street-label="Street"
          city-label="City"
          country-label="Country"
          province-label="Province"
          postal-code-label="PostalCode"
          street="121 Spear St."
          city="San Francisco"
          country="US"
          province="CA"
          postal-code="94105"
          required
          field-level-help="Help Text for inputAddress field"
        ></lightning-input-address>
      </lightning-layout-item>
    </lightning-layout>
  </lightning-modal-body>
  <lightning-modal-footer>
    <lightning-button
      label="Cancel"
      title="Cancel"
      onclick={handleClick}
    ></lightning-button>
    <lightning-button
      label="Okay"
      title="Okay"
      onclick={handleSave}
    ></lightning-button>
  </lightning-modal-footer>
</template>

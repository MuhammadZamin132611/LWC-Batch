<template>

    <!-- Display the Selected Record Information Start...... -->

    <div if:true={selectedRecord} class="slds-form-element slds-p-around_small">
        <label class="slds-form-element__label" for="combobox-id-5" id="combobox-label-id-15">{label}</label>
        <div class="slds-form-element__control">
            <div class="slds-combobox_container slds-has-selection">
                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_left-right"
                        role="none">
                        <span class="slds-icon_container slds-icon-standard-account slds-combobox__input-entity-icon"
                            title="Account">
                            <svg class="slds-icon slds-icon_small" aria-hidden="true">
                                <use xlink:href={iconUrl}>
                                </use>
                            </svg>
                            <span class="slds-assistive-text">{objectLabel}</span>
                        </span>
                        <div role="combobox" tabindex="0"
                            class="slds-input_faux slds-combobox__input slds-combobox__input-value"
                            aria-labelledby="combobox-label-id-15" id="combobox-id-5-selected-value"
                            aria-controls="listbox-id-5" aria-expanded="false" aria-haspopup="listbox">
                            <span class="slds-truncate" id="combobox-value-id-2">{selectedRecord.Name}</span>
                        </div>
                        <button onclick={handleCloseSelectedRecord}
                            class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                            title="Remove selected option">
                            <svg class="slds-button__icon" aria-hidden="true">
                                <use
                                    xlink:href="/apexpages/slds/latest/assets/icons/utility-sprite/svg/symbols.svg#close">
                                </use>
                            </svg>
                            <span class="slds-assistive-text">Remove selected option</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Display the Selected Record Information END ...... -->

    <!-- Display the list of records Start ...... -->
    <div if:false={selectedRecord} class="slds-form-element slds-p-around_small">
        <label class="slds-form-element__label" for="combobox-id-2" id="combobox-label-id-6">{label}</label>
        <div class="slds-form-element__control">
            <div class="slds-combobox_container">
                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                        <input onchange={handleChange} onkeyup={handleChange}
                            class="slds-input slds-combobox__input slds-has-focus" id="combobox-id-2"
                            aria-autocomplete="list" aria-controls="listbox-id-2" aria-expanded="true"
                            aria-haspopup="listbox" role="combobox" type="text" placeholder="Search..." />
                        <span
                            class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
                            <svg class="slds-icon slds-icon slds-icon_x-small slds-icon-text-default"
                                aria-hidden="true">
                                <use
                                    xlink:href="/apexpages/slds/latest/assets/icons/utility-sprite/svg/symbols.svg#search">
                                </use>
                            </svg>
                        </span>
                    </div>
                    <div lwc:if={searchText} id="listbox-id-2"
                        class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid" role="listbox"
                        tabindex="0" aria-busy="false">
                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                            <li lwc:if={searchText} role="presentation" class="slds-listbox__item">
                                <div aria-selected="true" id="option0"
                                    class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_term "
                                    role="option">
                                    <span class="slds-media__figure slds-listbox__option-icon">
                                        <span class="slds-icon_container slds-icon-utility-search"
                                            title="Search for term: ">
                                            <svg class="slds-icon slds-icon_x-small slds-icon-text-default"
                                                aria-hidden="true">
                                                <use
                                                    xlink:href="/apexpages/slds/latest/assets/icons/utility-sprite/svg/symbols.svg#search">
                                                </use>
                                            </svg>
                                            <span class="slds-assistive-text">Search for term:</span>
                                        </span>
                                    </span>
                                    <span class="slds-media__body">
                                        <span
                                            class="slds-listbox__option-text slds-listbox__option-text_entity">{searchText}</span>
                                    </span>
                                </div>
                            </li>
                            <template if:true={data} for:each={data} for:item="item" for:index="index">
                                <li key={item.Id} role="presentation" class="slds-listbox__item"
                                    data-record-id={item.Id} onclick={handleItemClicked}>
                                    <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                        role="option">
                                        <span class="slds-media__figure slds-listbox__option-icon">
                                            <span class="slds-icon_container slds-icon-standard-account">
                                                <svg class="slds-icon slds-icon_small" aria-hidden="true">
                                                    <use xlink:href={iconUrl}>
                                                    </use>
                                                </svg>
                                            </span>
                                        </span>
                                        <span class="slds-media__body">
                                            <span
                                                class="slds-listbox__option-text slds-listbox__option-text_entity">{item.Name}</span>
                                            <span
                                                class="slds-listbox__option-meta slds-listbox__option-meta_entity">{objectLabel}</span>
                                        </span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Display the list of records END ...... -->

</template>
